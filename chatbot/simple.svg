<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 890" width="1000" height="890" role="img" aria-labelledby="t d">
  <title id="t">The Insight Engine</title>
  <desc id="d">You ask a question. The harness we build remembers the conversation, reads uploads, searches CHIRP's reports and cites sources. Charts and maps are not yet in scope. It sends words to the OpenAI LLM model and gets words back. The answers come from CHIRP's report database, which CHIRP staff check.</desc>
  <defs>
    <style>
      text { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1a2238; }
      .h1 { font-size: 22px; font-weight: 800; fill: #0c2547; }
      .sub { font-size: 13px; fill: #5a6478; }
      .ttl { font-size: 17px; font-weight: 800; fill: #0c2547; }
      .ttlO { font-size: 17px; font-weight: 800; fill: #e26f0f; }
      .ln { font-size: 14px; fill: #1a2238; }
      .lnS { font-size: 12.5px; fill: #5a6478; }
      .kick { font-size: 11.5px; font-weight: 700; letter-spacing: 0.1em; fill: #15375e; }
      .kickO { font-size: 11.5px; font-weight: 700; letter-spacing: 0.1em; fill: #e26f0f; }
      .labO { font-size: 13px; font-weight: 700; fill: #e26f0f; }
      .lab { font-size: 12px; fill: #5a6478; }
      .big { font-size: 20px; font-weight: 800; fill: #0c2547; }
      .arr { stroke: #15375e; stroke-width: 2; fill: none; }
      .arrO { stroke: #f58220; stroke-width: 2.2; fill: none; }
    </style>
    <marker id="aN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#15375e" />
    </marker>
    <marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f58220" />
    </marker>
  </defs>

  <rect width="1000" height="890" fill="#f7f8fa" />

  <text x="40" y="44" class="h1">The Insight Engine</text>
  <text x="40" y="66" class="sub">Navy: what we build. Orange: what OpenAI provides.</text>

  <!-- You -->
  <rect x="40" y="190" width="170" height="110" rx="14" fill="#fff" stroke="#15375e" stroke-width="1.6" />
  <text x="125" y="232" text-anchor="middle" class="ttl">You</text>
  <text x="125" y="256" text-anchor="middle" class="lnS">ask a question,</text>
  <text x="125" y="274" text-anchor="middle" class="lnS">get a cited answer</text>
  <line x1="210" y1="245" x2="268" y2="245" class="arr" marker-start="url(#aN)" marker-end="url(#aN)" />

  <!-- Harness -->
  <rect x="270" y="96" width="400" height="300" rx="18" fill="#eef2f8" stroke="#15375e" stroke-width="1.6" stroke-dasharray="8 6" />
  <text x="296" y="128" class="kick">WHAT WE BUILD · "THE HARNESS"</text>
  <text x="296" y="156" class="big">Everything that makes it a chatbot</text>
  <g>
    <circle cx="304" cy="192" r="4" fill="#15375e" /><text x="318" y="197" class="ln">Remembers the conversation</text>
    <circle cx="304" cy="224" r="4" fill="#15375e" /><text x="318" y="229" class="ln">Reads your photos and documents</text>
    <circle cx="304" cy="256" r="4" fill="#15375e" /><text x="318" y="261" class="ln">Searches CHIRP's reports</text>
    <circle cx="304" cy="288" r="4" fill="#15375e" /><text x="318" y="293" class="ln">Charts and maps, if in scope</text>
    <circle cx="304" cy="320" r="4" fill="#15375e" /><text x="318" y="325" class="ln">Cites a report for every claim</text>
    <circle cx="304" cy="352" r="4" fill="#15375e" /><text x="318" y="357" class="ln">Learns from past questions</text>
  </g>

  <!-- OpenAI -->
  <rect x="770" y="170" width="190" height="164" rx="14" fill="#fff8f0" stroke="#f58220" stroke-width="2" />
  <text x="788" y="198" class="kickO">OPENAI</text>
  <text x="788" y="224" class="ttlO">The LLM model</text>
  <text x="788" y="254" class="ln">Words in, words out.</text>
  <text x="788" y="274" class="ln">Nothing else.</text>
  <text x="788" y="300" class="lnS"><tspan font-weight="700" fill="#e26f0f">Stateless:</tspan> it keeps</text>
  <text x="788" y="317" class="lnS">nothing between replies.</text>

  <line x1="670" y1="222" x2="768" y2="222" class="arrO" marker-end="url(#aO)" />
  <text x="719" y="212" text-anchor="middle" class="labO">words</text>
  <line x1="770" y1="270" x2="672" y2="270" class="arrO" marker-end="url(#aO)" />
  <text x="719" y="292" text-anchor="middle" class="labO">words</text>

  <rect x="770" y="352" width="190" height="104" rx="12" fill="#fff" stroke="#c9d3e0" stroke-width="1.2" />
  <text x="786" y="375" class="labB" style="font-size:12.5px;font-weight:700;fill:#0c2547">Using ChatGPT or Claude</text>
  <text x="786" y="396" class="lnS">You get the model plus the</text>
  <text x="786" y="413" class="lnS">harness its makers built:</text>
  <text x="786" y="430" class="lnS">memory, web search,</text>
  <text x="786" y="447" class="lnS">uploads, charts.</text>

  <rect x="770" y="466" width="190" height="104" rx="12" fill="#fff8f0" stroke="#f58220" stroke-width="1.2" />
  <text x="786" y="489" class="labO" style="font-size:12.5px">Using the OpenAI API</text>
  <text x="786" y="510" class="lnS">We get the model only.</text>
  <text x="786" y="527" class="lnS">Words in, words out. The</text>
  <text x="786" y="544" class="lnS">harness is ours to build,</text>
  <text x="786" y="561" class="lnS">host and pay for.</text>

  <!-- Database -->
  <line x1="470" y1="396" x2="470" y2="456" class="arr" marker-start="url(#aN)" marker-end="url(#aN)" />
  <rect x="270" y="458" width="400" height="112" rx="16" fill="#fff" stroke="#15375e" stroke-width="1.6" />
  <text x="296" y="490" class="kick">WHAT WE BUILD · CHIRPDB</text>
  <text x="296" y="516" class="ttl">CHIRP's report database</text>
  <text x="296" y="539" class="lnS">Every answer comes from here, and only from reports</text>
  <text x="296" y="555" class="lnS">CHIRP staff have checked.</text>

  <!-- Sources -->
  <rect x="40" y="470" width="170" height="76" rx="12" fill="#fff" stroke="#c9d3e0" stroke-width="1.2" />
  <text x="56" y="498" class="ttl" style="font-size:14px">Reports from</text>
  <text x="56" y="518" class="lnS">~15 countries, plus</text>
  <text x="56" y="535" class="lnS">short free-text reports</text>
  <line x1="210" y1="508" x2="268" y2="508" class="arr" marker-end="url(#aN)" />
  <text x="239" y="498" text-anchor="middle" class="lab">read in</text>

  <!-- Key -->
  <line x1="40" y1="598" x2="960" y2="598" stroke="#e5e7eb" />
  <text x="40" y="626" class="kick">KEY: WHO DOES WHAT</text>

  <rect x="40" y="640" width="293" height="228" rx="12" fill="#fff8f0" stroke="#f58220" stroke-width="1.6" />
  <text x="56" y="666" class="ttlO" style="font-size:15px">LLM</text>
  <text x="96" y="666" class="lnS">the LLM model, from OpenAI</text>
  <text x="56" y="690" class="lnS" style="font-weight:700;fill:#0c2547">A model is something like Claude</text>
  <text x="56" y="707" class="lnS" style="font-weight:700;fill:#0c2547">Opus 5.5 or OpenAI's GPT-5.4.</text>
  <text x="56" y="731" class="lnS">Reads words and writes words. It</text>
  <text x="56" y="748" class="lnS">understands the question, drafts the</text>
  <text x="56" y="765" class="lnS">answer and tells the harness what to</text>
  <text x="56" y="782" class="lnS">fetch. Stateless: it can't remember,</text>
  <text x="56" y="799" class="lnS">search, draw or look anything up</text>
  <text x="56" y="816" class="lnS">by itself.</text>

  <rect x="353" y="640" width="293" height="228" rx="12" fill="#eef2f8" stroke="#15375e" stroke-width="1.6" stroke-dasharray="6 4" />
  <text x="369" y="666" class="ttl" style="font-size:15px">Harness</text>
  <text x="438" y="666" class="lnS">our software, built by us</text>
  <text x="369" y="690" class="lnS" style="font-weight:700;fill:#0c2547">This is what ChatGPT and Claude are:</text>
  <text x="369" y="707" class="lnS" style="font-weight:700;fill:#0c2547">a harness around their makers' LLM.</text>
  <text x="369" y="731" class="lnS">Ours wraps OpenAI's LLM. It</text>
  <text x="369" y="748" class="lnS">remembers the chat, reads uploads,</text>
  <text x="369" y="765" class="lnS">searches the database and the web,</text>
  <text x="369" y="782" class="lnS">checks every citation and keeps</text>
  <text x="369" y="799" class="lnS">usage and costs in limits. Charts or</text>
  <text x="369" y="816" class="lnS">heat maps, if wanted, live here too.</text>

  <rect x="667" y="640" width="293" height="228" rx="12" fill="#fff" stroke="#15375e" stroke-width="1.6" />
  <text x="683" y="666" class="ttl" style="font-size:15px">Everything else</text>
  <text x="808" y="666" class="lnS">the data</text>
  <text x="683" y="690" class="lnS" style="font-weight:700;fill:#0c2547">Where the facts live. Not AI: it</text>
  <text x="683" y="707" class="lnS" style="font-weight:700;fill:#0c2547">stores data and hands it back.</text>
  <text x="683" y="731" class="lnS">Reports come from ~15 countries,</text>
  <text x="683" y="748" class="lnS">plus short free-text reports. CHIRPdb</text>
  <text x="683" y="765" class="lnS">breaks each one into sentences,</text>
  <text x="683" y="782" class="lnS">recommendations, safety issues,</text>
  <text x="683" y="799" class="lnS">people and vessels, keeps the PDF,</text>
  <text x="683" y="816" class="lnS">and remembers what past questions</text>
  <text x="683" y="833" class="lnS">taught it. The public only sees what</text>
  <text x="683" y="850" class="lnS">CHIRP staff have checked.</text>
</svg>
